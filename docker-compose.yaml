version: '3.8'

services:
  scraper:
    build: ./scraper
    container_name: newsletter-scraper
    ports:
      - "5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - newsletter-network

  screener:
    build: ./screener
    container_name: newsletter-screener
    ports:
      - "5002:5002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - screenshot-data:/tmp/screener_screenshots
    networks:
      - newsletter-network
    shm_size: 512mb  # Increase shared memory for Chromium

networks:
  newsletter-network:
    driver: bridge

volumes:
  screenshot-data:
